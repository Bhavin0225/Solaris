[project]
name = "swf"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=3.0.6,<3.1", "numpy==2.5.4", "pyarrow==26.0.0", "pyyaml==6.0.3", "pydantic==2.14.2",
  "httpx==0.28.1", "tenacity==9.2.1",
  "pvlib==0.16.1", "lightgbm==4.7.0",
  "fastapi==0.162.0", "uvicorn==0.54.0", "apscheduler>=3.11.3,<4",
]

[project.optional-dependencies]
train = [
  "torch==2.15.0", "darts[torch]==0.48.1", "pytorch-lightning>=2.6.6",
  "matplotlib", "scikit-learn==1.9.1", "kaggle==2.2.5", "six",   # six: kaggle 2.2.5 imports it but does not declare it
]

[dependency-groups]
dev = ["pytest>=9.2", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swf"]

[tool.uv]
# Without this, uv tries to resolve macOS too and fails (PyTorch has no CUDA wheels for macOS).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
link-mode = "copy"   # uv cache is on C:, project on F:; avoids hardlink-fallback warnings

[tool.uv.sources]
torch = [{ index = "pytorch-cu134", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true     # only `torch` may come from here; everything else stays on PyPI

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: hits live APIs (opt-in: pytest -m network)", "gpu: needs CUDA torch (train env)"]
