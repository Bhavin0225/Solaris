<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F7FA6" />
    <title>Solar &amp; Wind Forecast · Davanagere</title>
    <script>
      // Apply the stored theme before first paint; storage may be blocked, so fall back to light.
      (function () {
        var t = 'light';
        try {
          if (localStorage.getItem('swf-theme') === 'dark') t = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
