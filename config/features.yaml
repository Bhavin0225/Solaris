# Phase 4 features, splits and evaluation (FEAT-01..06, EVAL-01..07). All times UTC.
spec_version: 2  # bump by hand when feature computation logic changes
horizon_max: 72
lags: [0, 1, 2, 3, 4, 5, 6, 12, 24, 48, 168]  # lag0 = value at the origin, persistence input (RESEARCH A1)
windows: [6, 24]  # trailing, include the origin label
monsoon_months: [6, 7, 8, 9]  # UTC target-time months
splits:
  train_weather_only: ["2001-01-01T00:00:00Z", "2023-12-31T23:00:00Z"]
  train_covariate: ["2021-04-01T00:00:00Z", "2023-12-31T23:00:00Z"]  # GFS Historical Forecast valid from 2021-03-22 23:00
  val: ["2024-01-01T00:00:00Z", "2024-12-31T23:00:00Z"]
  test: ["2025-01-01T00:00:00Z", "2025-12-31T23:00:00Z"]
eval:
  horizons: [1, 6, 24, 48, 72]  # exact horizons, no buckets, plus "all"; this is the stated bucket choice
  daytime_zenith_deg: 85.0  # midpoint zenith; t1_kw and ghi scored daytime only
  csi_min_clearsky_wm2: 1.0  # csi = 0 where clear-sky GHI <= this; csi clipped to [0, 2]
  min_shared_frac: 0.5  # Pitfall 3 guard
